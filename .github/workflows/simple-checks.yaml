---
name: Simple Checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    name: Compile, Vet and Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: --locked
      - run: go test -run='^$' ./...
      - run: go vet ./...
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: actionlint
      - run: zizmor --offline .github
      - name: Validate Bake Definitions
        run: |
          for app in apps/*; do
            (cd "$app" && docker buildx bake image-all --print)
          done
      - name: Check Generated README
        run: |
          python3 scripts/render-readme.py
          git diff --exit-code -- README.md
