---
name: Get Changed Images
on:
  workflow_call:
    inputs:
      app:
        type: string
        default: ''
    outputs:
      apps:
        description: JSON array of existing apps to build
        value: ${{ jobs.changed.outputs.apps }}
permissions:
  contents: read
jobs:
  changed:
    name: Get Changed Images
    runs-on: ubuntu-26.04
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Apps
        id: apps
        env:
          APP: ${{ inputs.app }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          if [[ -n "$APP" ]]; then
            apps=$(python3 scripts/select-apps.py --app "$APP")
          else
            apps=$(python3 scripts/select-apps.py --base "$BASE_SHA" --head "$HEAD_SHA")
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
