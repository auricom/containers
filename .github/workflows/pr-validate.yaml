---
name: 'Pull Request: Validate'
on:
  pull_request:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  simple-checks:
    uses: ./.github/workflows/simple-checks.yaml
  get-changed-images:
    uses: ./.github/workflows/get-changed-images.yaml
  build-images:
    needs: get-changed-images
    if: ${{ needs.get-changed-images.outputs.apps != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        app: ${{ fromJSON(needs.get-changed-images.outputs.apps) }}
    uses: ./.github/workflows/app-builder.yaml
    with:
      app: ${{ matrix.app }}
      release: false
  status:
    name: Build matrix success
    if: ${{ always() }}
    needs: [simple-checks, get-changed-images, build-images]
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Check Results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          jq -e 'all(. != "failure" and . != "cancelled")' <<< "$RESULTS"
