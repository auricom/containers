---
name: Render Readme
on:
  workflow_call:
permissions:
  contents: write
concurrency:
  group: render-readme
  cancel-in-progress: false
jobs:
  render-readme:
    name: Render README
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Render README
        run: python3 scripts/render-readme.py
      - name: Commit Inventory Changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! git diff --quiet -- README.md; then
            gh api --method PUT "repos/$REPO/contents/README.md" \
              -f message='chore: render README.md' \
              -f content="$(base64 -w0 README.md)" \
              -f sha="$(git rev-parse HEAD:README.md)" \
              -f branch=main
          fi
