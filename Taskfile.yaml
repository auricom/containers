---
version: '3'
tasks:
  default:
    silent: true
    cmds: [task --list]
  build:
    desc: 'Build a local image: task APP=toolbox build'
    requires:
      vars: [APP]
    dir: apps/{{.APP}}
    cmds:
      - docker buildx bake image-local --load
  test:
    desc: 'Build and run container tests: task APP=toolbox test'
    requires:
      vars: [APP]
    cmds:
      - task: build
      - |
        version=$(cd 'apps/{{.APP}}' && docker buildx bake image-local --print | jq -r '.target["image-local"].args.VERSION')
        TEST_IMAGE='{{.APP}}':"$version" go test -count=1 -v -timeout 5m './apps/{{.APP}}/...'
  check:
    desc: Compile tests, vet Go, and lint workflows
    cmds:
      - go test -run='^$' ./...
      - go vet ./...
      - python3 -m unittest discover -s scripts -p 'test_*.py'
      - actionlint
      - zizmor --offline .github
  render-readme:
    desc: Regenerate the image inventory
    cmds: [python3 scripts/render-readme.py]
